<!DOCTYPE html>
<html>
<head>
    <title>Galaxy Golf - Room</title>
    <link rel="stylesheet" href="Styling.css">
</head>
<body>
    <!-- ROOM VIEW (UC1-UC4)  -->
    <div class="room-page" id="room-view">
        <h1 class="room-page-title">Galaxy Golf</h1>

        <div class="room-code-card">
            <h2>Room Code</h2>
            <p class="room-code" id="room-code">------</p>
        </div>

        <div class="room-players-card">
            <h2>Players</h2>
            <ul id="player-list">
                <li>Connecting...</li>
            </ul>
        </div>

        <div class="room-courses-card">
            <h2>Select a Course</h2>

            <div class="course-options">
                <button type="button" class="course-button" data-course="course1">
                    Course 1
                </button>

                <button type="button" class="course-button" data-course="course2">
                    Course 2
                </button>

                <button type="button" class="course-button" data-course="course3">
                    Course 3
                </button>
            </div>
        </div>

        <p id="room-status" class="room-status"></p>

        <div class="room-page-buttons">
            <button type="button" id="leave-button">
                Leave Room
            </button>
            <button type="button" id="start-button">
                Start
            </button>
        </div>
    </div>

    <!-- GAME VIEW (UC5-UC9)
         Moved here from Game.html so the WebSocket opened by room.js stays
         open for the whole game. Shown when the server sends "game.started". -->
    <div class="play-game" id="game-view" hidden>
        <button type="button" class="leave-button" id="game-leave-button">
            Leave
        </button>
        <div class="game-card">
            <div class="GameStat">
                <label class="GameStatLabel">Player turn: <span id="turn-label">-</span></label>
                <br>
                <label class="GameStatLabel">Hole: <span id="hole-label">1</span></label>
                <br>
                <div class="scorecard">
                    <h2>Scorecard</h2>

                    <table class="golf-table">
                        <thead>
                            <tr id="score-head"></tr>
                        </thead>
                        <tbody id="score-body"></tbody>
                    </table>
                </div>
            </div>

            <p id="game-status" class="room-status"></p>

            <!-- UC5: the course and golf ball drawing goes here -->
            <div id="course-area"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/room.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
