<!DOCTYPE html>
<html>
<head>
    <title>Galaxy Golf - Room</title>
    <link rel="stylesheet" href="Styling.css">
</head>
<body>
    <div class="room-page">
        <h1 class="room-page-title">Galaxy Golf</h1>

        <div class="room-code-card">
            <h2>Room Code</h2>
            <p class="room-code" id="room-code">------</p>
        </div>

        <div class="room-players-card">
            <h2>Players</h2>
            <ul id="player-list">
                <li>Connecting...</li>
            </ul>
        </div>

        <div class="room-courses-card">
            <h2>Select a Course</h2>

            <div class="course-options">
                <button type="button" class="course-button" data-course="course1">
                    Course 1
                </button>

                <button type="button" class="course-button" data-course="course2">
                    Course 2
                </button>

                <button type="button" class="course-button" data-course="course3">
                    Course 3
                </button>
            </div>
        </div>

        <p id="room-status" class="room-status"></p>

        <div class="room-page-buttons">
            <button type="button" id="leave-button">
                Leave Room
            </button>
            <button type="button" id="start-button">
                Start
            </button>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/room.js"></script>
</body>
</html>
