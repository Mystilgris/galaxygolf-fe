<!DOCTYPE html>
<html>
<head>
    <title>Create Room - Galaxy Golf</title>

</head>
<body>

        <h1 class="room-title">Create Room</h1>
        <div class="username-card">

        <form action="Room.html">

            <input type="text" id="username" name="username"

            <div class="room-buttons">

                    Cancel
                </button>

                <button type="submit">
                    Submit
                </button>
            </div>
        </form>
        
        </div>
    </div>
</body>
</html>
