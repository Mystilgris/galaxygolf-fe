<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Join Room - Galaxy Golf</title>
    <link rel="stylesheet" href="Styling.css">
</head>
<body>
    <div class="create-room">
        <h1 class="room-title">Join Room</h1>
        <div class="username-card">

        <form action="Room.html">
            <label for="RoomCode">Enter Room Code</label>
            <input type="text" minlength="6" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" id="RoomCode" name="RoomCode" title="Room code is 6 digits"
                placeholder="Room Code" required>
            <label for="Username"><br>Enter Username</label>
            <input type="text" id="Username" name="Username" placeholder="Username" required>

            <div class="room-buttons">
                <button type="button" onclick="window.location.href='HomePage.html'">
                    Cancel
                </button>

                <button type="submit">
                    Submit
                </button>
            </div>
        </form>
        
        </div>
    </div>
</body>
</html>
