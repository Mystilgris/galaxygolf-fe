<!DOCTYPE html>
<html>
<head>
    <title>Create Room - Galaxy Golf</title>
    <link rel="stylesheet" href="Styling.css">
</head>
<body>
    <div class="create-room">
        <h1 class="room-title">Join Room</h1>
        <div class="username-card">

        <form action="Room.html">
            <label for="username">Enter Room Code</label>
            <input type="text" minlength="6" maxlength="6" pattern="[A-Za-z0-9]{6}" id="RoomCode" name="RoomCode" title="Room code is a combination of 6 letters and numbers"
                   placeholder="Room Code" required>

            <div class="room-buttons">
                <button type="button" onclick="window.location.href='HomePage.html'">
                    Cancel
                </button>

                <button type="submit">
                    Submit
                </button>
            </div>
        </form>
        
        </div>
    </div>
</body>
</html>
