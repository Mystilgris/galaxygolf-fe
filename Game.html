<!DOCTYPE html>
<html>
<head>
    <title>Play Galaxy Golf</title>
    <link rel="stylesheet" href="Styling.css">
</head>
<body>
    <div class="play-game">
        <button class="leave-button"
                onclick="window.location.href='HomePage.html'">
             Leave
        </button>
        <div class="game-card">
            <div class="GameStat">
                <label class="GameStatLabel">Player turn: Player1</label>
                <br>
                <label class="GameStatLabel">Round: 1</label>
                <br>
                 <div class="scorecard">
                <h2>Scorecard</h2>

                <table class="golf-table">
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>Hole 1</th>
                            <th>Hole 2</th>
                            <th>Hole 3</th>
                            <th>Total</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>Player 1</td>
                            <td>3</td>
                            <td>4</td>
                            <td>3</td>
                            <td class="total-score">10</td>
                        </tr>

                        <tr>
                            <td>Player 2</td>
                            <td>5</td>
                            <td>5</td>
                            <td>4</td>
                            <td class="total-score">14</td>
                        </tr>

                        <tr>
                            <td>Player 3</td>
                            <td>4</td>
                            <td>4</td>
                            <td>3</td>
                            <td class="total-score">11</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            </div>    
        </div>
        </div>
    </div>
</body>
</html>
